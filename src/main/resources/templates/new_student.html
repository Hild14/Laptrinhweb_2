<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Thêm Sinh Viên Mới</title>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">Hệ Thống Quản Lý Sinh Viên</a>
      </div>
    </nav>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-lg border-0 rounded-3">
            <div class="card-header bg-success text-white py-3">
              <h4 class="text-center mb-0">
                <i class="fas fa-user-plus me-2"></i>Thông Tin Sinh Viên
              </h4>
            </div>

            <div class="card-body p-4">
              <form th:action="@{/save}" th:object="${student}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                  <label class="form-label fw-bold">Họ và Tên:</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fas fa-user"></i>
                    </span>
                    <input
                      type="text"
                      th:field="*{name}"
                      class="form-control"
                      placeholder="Nhập họ tên đầy đủ"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Email:</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fas fa-envelope"></i>
                    </span>
                    <input
                      type="email"
                      th:field="*{email}"
                      class="form-control"
                      placeholder="Nhập địa chỉ email"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Tuổi:</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fas fa-birthday-cake"></i>
                    </span>
                    <input
                      type="number"
                      th:field="*{age}"
                      class="form-control"
                      placeholder="Nhập tuổi"
                      min="1"
                      max="100"
                      required
                    />
                  </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                  <button type="submit" class="btn btn-success btn-lg">
                    <i class="fas fa-check-circle me-2"></i>Lưu Lại
                  </button>
                  <a href="/" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Quay Về Danh Sách
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
